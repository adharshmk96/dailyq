services:
  dailyq:
    build:
      context: .
      dockerfile: Dockerfile
    image: dailyq:latest
    restart: unless-stopped
    environment:
      DAILYQ_SERVER_MODE: release
      DAILYQ_SERVER_BASE_URL: ${DAILYQ_SERVER_BASE_URL:-http://localhost:8080}
      DAILYQ_DATABASE_DSN: /data/dailyq.db
      DAILYQ_AUTH_JWT_SECRET: ${DAILYQ_AUTH_JWT_SECRET:?set a strong secret}
      DAILYQ_LOG_LEVEL: ${DAILYQ_LOG_LEVEL:-info}
      DAILYQ_LOG_FORMAT: json
    volumes:
      - dailyq-data:/data
    ports:
      # Dokploy routes through Traefik on the internal network; this published
      # port is mainly for running the stack locally.
      - "${DAILYQ_PORT:-8080}:8080"
    networks:
      - dokploy-network

volumes:
  dailyq-data:

networks:
  dokploy-network:
    external: true
